name: Release

# 推一个 v* 标签 = 一次完整交付：校验版本 → 跑测试 → 发 npm → 发 GitHub release。
# 任一步失败，后面都不执行 —— 避免出现「npm 上有版本但仓库没产物」或反过来的漂移。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write     # 建 release、上传产物
  id-token: write     # npm provenance 签名

# 同一标签重复触发时排队而不是并发，否则两次 publish 会互相踩
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PACKAGE: '@vertixara/dsh-prompt-manager'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Environment
        run: node -v && npm -v

      # 自动化发布最容易出的事故：标签和 package.json 版本对不上，
      # 结果 npm 上多出一个谁也对不上的版本号，而 npm 不允许覆盖重发。
      - name: Tag agrees with package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::标签 $tag 与 package.json 的 $pkg 不一致，两者必须相同"
            exit 1
          fi

      - name: Test
        run: node --test --test-isolation=none "test/*.test.mjs"

      - name: Self-checks
        run: |
          node test/check-client.mjs
          node test/check-diff.mjs

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Pack
        run: npm pack

      # OIDC 认证要 npm CLI >= 11.5.1（Node 22.14+ 才有）。版本不够时
      # publish 会退回 token 认证，而这里已经没有 token 了，所以先拦住。
      - name: npm CLI supports OIDC
        run: |
          set -euo pipefail
          node -e '
            const v = require("node:child_process").execSync("npm -v").toString().trim();
            const [maj, min, pat] = v.split(".").map(Number);
            console.log("npm", v);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) { console.error(`npm ${v} 过低，OIDC 需要 >= 11.5.1`); process.exit(1); }
          '

      - name: Publish
        id: publish
        run: |
          set -uo pipefail
          version="${GITHUB_REF_NAME#v}"

          # 幂等：已存在的版本不重发。重推标签只为刷新 GitHub 产物时必须走到这里，
          # 否则 npm 会以 403 拒绝，把整条交付流程变红。
          if npm view "$PACKAGE@$version" version >/dev/null 2>&1; then
            echo "::notice::$PACKAGE@$version 已存在于 npm，跳过发布"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 认证走 OIDC trusted publishing：npm CLI 自己发现 Actions 的 OIDC 环境，
          # 拿一个短期的 workflow 身份令牌去换发布令牌。没有长期 token 可泄露，
          # 也不会再撞上「This operation requires a one-time password」——
          # 密钥不在 CI 里，就没有 2FA 需要满足。
          #
          # provenance 由 npm 在 OIDC 发布时自动生成（公开仓库 + 公开包），
          # 不需要 --provenance 参数。
          #
          # npm 把失败原因只写进日志，而日志要登录才能下载。
          # 这里自己收集输出，把关键行转成 annotation，直接显示在 Actions 页面。
          set +e
          output="$(npm publish 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"

          if [ "$status" -ne 0 ]; then
            echo "::error title=npm publish 失败（exit $status）::原因见下方逐条注解"
            printf '%s\n' "$output" \
              | grep -Ei 'npm (error|warn)|E[0-9]{3}|forbidden|two-factor|OTP|unauthor|OIDC|trusted' \
              | head -15 \
              | while IFS= read -r line; do
                  echo "::error::${line}"
                done || true
            exit "$status"
          fi

          echo "published=true" >> "$GITHUB_OUTPUT"

      # 发出去不等于能装到。registry 是最终一致的，这里轮询到真正可见为止，
      # 免得下游在窗口期里装到上一版。
      - name: Confirm it on the registry
        if: steps.publish.outputs.published == 'true'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 12); do
            if npm view "$PACKAGE@$version" version >/dev/null 2>&1; then
              echo "registry 已可见 $PACKAGE@$version"
              exit 0
            fi
            echo "等待 registry 生效… $i/12"
            sleep 5
          done
          echo "::error::发布命令返回成功，但 60 秒内 registry 仍查不到 $PACKAGE@$version"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: ./*.tgz

  github-release:
    name: GitHub release
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tarball

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          # 标签重推（例如改包名）时，原 release 会因失去 tag 绑定退化成 draft，
          # 所以已存在时不但要覆盖产物，还要显式发布
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release 已存在，覆盖产物并确保已发布"
            gh release upload "$tag" ./*.tgz --clobber
            gh release edit "$tag" --draft=false --title "$tag"
          else
            gh release create "$tag" --title "$tag" --generate-notes ./*.tgz
          fi

          # 清掉不属于本次构建的遗留产物：以刚打出来的 tgz 文件名为白名单
          keep=$(ls ./*.tgz | xargs -n1 basename | tr '\n' ' ')
          gh release view "$tag" --json assets -q '.assets[].name' | while read -r asset; do
            case " $keep " in
              *" $asset "*) ;;
              *) echo "删除旧产物: $asset"; gh release delete-asset "$tag" "$asset" -y ;;
            esac
          done