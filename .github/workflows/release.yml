name: Release

# 推一个 v* 标签就发布：跑测试 → 打包 → 建 release 并把 tarball 挂上去。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Environment
        run: node -v && npm -v

      # 测试不过就不发版，避免挂一个跑不起来的包出去
      - name: Test
        run: node --test --test-isolation=none "test/*.test.mjs"

      - name: Self-checks
        run: |
          node test/check-client.mjs
          node test/check-diff.mjs

      - name: Pack
        run: npm pack

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="$GITHUB_REF_NAME"

          # 标签重推（例如改了包名）时，原 release 会因失去 tag 绑定退化成 draft，
          # 所以已存在时不但要覆盖产物，还要显式发布
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release 已存在，覆盖产物并确保已发布"
            gh release upload "$TAG" ./*.tgz --clobber
            gh release edit "$TAG" --draft=false --title "$TAG"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes ./*.tgz
          fi

          # 清掉不属于本次构建的遗留产物：以刚打出来的 tgz 文件名为白名单
          keep=$(ls ./*.tgz | xargs -n1 basename | tr '\n' ' ')
          gh release view "$TAG" --json assets -q '.assets[].name' | while read -r asset; do
            case " $keep " in
              *" $asset "*) ;;
              *) echo "删除旧产物: $asset"; gh release delete-asset "$TAG" "$asset" -y ;;
            esac
          done